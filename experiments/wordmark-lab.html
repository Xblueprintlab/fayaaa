<!doctype html>
<meta charset="utf-8">
<title>Fayaaa wordmark lab</title>
<style>body{margin:0;background:#111;color:#888;font:12px monospace}canvas{display:block;margin:18px auto;background:#000;border-radius:8px}p{text-align:center;margin:4px 0 0}</style>
<body>
<p>V1 — BRUSH SIGNATURE: slant 30°, big loops, pressure 0.8→2.9, return slash</p>
<canvas id="v1" width="1000" height="240"></canvas>
<p>V2 — milder brush: slant 24°, pressure 1.0→2.4, slash</p>
<canvas id="v2" width="1000" height="240"></canvas>
<p>V3 — subtle: slant 8°, asc 0.82, desc 0.85</p>
<canvas id="v3" width="1000" height="240"></canvas>
<p>V4 — untouched Hershey (current) for reference</p>
<canvas id="v4" width="1000" height="240"></canvas>
<script>
const GLYPHS = {
  f: { o: 5, tailTrim: 3, entry: [0,17], d: "M0,17 L4,12 6,9 7,7 8,4 8,2 7,1 5,2 4,4 2,12 -1,21 -4,28 -5,31 -5,33 -4,34 -2,33 -1,30 0,21 1,22 3,22 5,21 6,20 8,17" },
  a: { o: 10, tailTrim: 3, entry: [1,21], d: "M9,16 L8,14 6,13 4,13 2,14 1,15 0,17 0,19 1,21 3,22 5,22 7,21 8,19 10,13 9,18 9,21 10,22 11,22 13,21 14,20 16,17" },
  y: { o: 9, tailTrim: 2, entry: [1,22], d: "M0,17 L2,13 0,19 0,21 1,22 3,22 5,21 7,19 9,16 M10,13 L4,31 3,33 1,34 0,33 0,31 1,28 4,25 7,23 9,22 12,20 15,17" },
};
function parse(d, dx) {
  const subs = []; let cur;
  for (const t of d.split(/[\sL]+/)) {
    if (!t) continue;
    const mv = t.startsWith("M");
    const [x, y] = t.replace("M", "").split(",").map(Number);
    if (mv || !cur) { cur = []; subs.push(cur); }
    cur.push([x + dx, y]);
  }
  return subs;
}
function smooth(pts, per = 8) {
  if (pts.length < 3) return pts;
  const out = [pts[0]];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    for (let s = 1; s <= per; s++) {
      const t = s / per, t2 = t * t, t3 = t2 * t;
      out.push([
        0.5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
        0.5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3),
      ]);
    }
  }
  return out;
}
function build(word, { spacing, trim, connect }) {
  const raw = [];
  let cursor = 0;
  const arr = [...word];
  for (let l = 0; l < arr.length; l++) {
    const g = GLYPHS[arr[l]];
    const subs = parse(g.d, cursor);
    if (trim && l < arr.length - 1) {
      const last = subs[subs.length - 1];
      subs[subs.length - 1] = last.slice(0, Math.max(2, last.length - g.tailTrim));
    }
    raw.push(...subs);
    cursor += g.o + spacing;
  }
  if (!connect) return raw.map(s => smooth(s));
  const merged = [];
  for (const sub of raw) {
    const cur = merged[merged.length - 1];
    const tail = cur && cur[cur.length - 1];
    const gap = tail ? Math.hypot(sub[0][0] - tail[0], sub[0][1] - tail[1]) : 1e9;
    if (cur && gap <= 16) cur.push(...sub);      // straight join, no shaping
    else merged.push([...sub]);
  }
  return merged.map(s => smooth(s));
}
function styleize(subs, { slant = 0, asc = 1, desc = 1, xs = 1 }) {
  // grid: baseline y=22, x-height top y=13, y grows down
  return subs.map(sub => sub.map(([x, y]) => {
    let ny = y;
    if (y < 13) ny = 13 - (13 - y) * asc;        // compress ascenders
    else if (y > 22) ny = 22 + (y - 22) * desc;  // compress descenders
    const nx = x * xs + slant * (22 - ny);        // then shear right
    return [nx, ny];
  }));
}
function buildTouch(word, spacing) {
  const raw = [];
  const arr = [...word];
  let cursor = 0;
  for (let l = 0; l < arr.length; l++) {
    const g = GLYPHS[arr[l]];
    const subs = parse(g.d, cursor);
    if (l < arr.length - 1) {
      const nxt = GLYPHS[arr[l + 1]];
      const nc = cursor + g.o + spacing;
      const last = subs[subs.length - 1];
      const kept = last.slice(0, Math.max(2, last.length - g.tailTrim));
      const E = kept[kept.length - 1];
      const P = [nxt.entry[0] + nc, nxt.entry[1]];
      kept.push([(E[0] + P[0]) / 2, Math.max(E[1], P[1]) + 0.4], P);
      subs[subs.length - 1] = kept;
    }
    raw.push(...subs);
    cursor += g.o + spacing;
  }
  return raw.map(s => smooth(s));
}
function addSwash(subs) {
  const last = subs[subs.length - 1];
  const E = last[last.length - 1];
  // the return slash: dive off the final tail and pull back left under the word
  last.push(
    [E[0] + 3.5, E[1] + 2],
    [E[0] + 1,  E[1] + 7],
    [E[0] - 10, E[1] + 12],
    [E[0] - 28, E[1] + 15.5],
    [E[0] - 44, E[1] + 16.8],
    [E[0] - 56, E[1] + 17.2],
  );
  return subs;
}
// brush pressure: thick when the pen travels downward, hairline on upstrokes
function widthsFor(subs, wMin, wMax) {
  return subs.map(sub => {
    const w = sub.map((pt, i) => {
      const a = sub[Math.max(0, i - 1)], b = sub[Math.min(sub.length - 1, i + 1)];
      const dx = b[0] - a[0], dy = b[1] - a[1];
      const len = Math.hypot(dx, dy) || 1;
      const down = Math.max(0, dy / len);
      return wMin + (wMax - wMin) * Math.pow(down, 0.7);
    });
    // smooth pressure so weight breathes instead of jittering
    return w.map((_, i) => {
      let s = 0, n = 0;
      for (let k = -6; k <= 6; k++) { const j = i + k; if (w[j] != null) { s += w[j]; n++; } }
      return s / n;
    });
  });
}
function drawVar(id, subs, wMin, wMax) {
  const c = document.getElementById(id), ctx = c.getContext("2d");
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (const s2 of subs) for (const [x, y] of s2) { minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y); }
  const unit = Math.min((c.height - 30) / (maxY - minY), (c.width - 50) / (maxX - minX));
  const ox = (c.width - (maxX - minX) * unit) / 2 - minX * unit;
  const oy = (c.height - (maxY - minY) * unit) / 2 - minY * unit;
  const widths = widthsFor(subs, wMin, wMax);
  ctx.lineCap = ctx.lineJoin = "round";
  ctx.strokeStyle = "#fff";
  subs.forEach((sub, si) => {
    for (let i = 1; i < sub.length; i++) {
      ctx.beginPath();
      ctx.lineWidth = ((widths[si][i - 1] + widths[si][i]) / 2) * unit;
      ctx.moveTo(ox + sub[i - 1][0] * unit, oy + sub[i - 1][1] * unit);
      ctx.lineTo(ox + sub[i][0] * unit, oy + sub[i][1] * unit);
      ctx.stroke();
    }
  });
}
function draw(id, subs, pen) {
  const c = document.getElementById(id), ctx = c.getContext("2d");
  let minX = 1e9, maxX = -1e9;
  for (const s of subs) for (const [x] of s) { minX = Math.min(minX, x); maxX = Math.max(maxX, x); }
  const unit = Math.min((c.height - 40) / 35, (c.width - 60) / (maxX - minX));
  const ox = (c.width - (maxX - minX) * unit) / 2 - minX * unit;
  ctx.lineCap = ctx.lineJoin = "round";
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = pen * unit;
  ctx.beginPath();
  for (const s of subs) {
    ctx.moveTo(ox + s[0][0] * unit, 20 + s[0][1] * unit);
    for (let i = 1; i < s.length; i++) ctx.lineTo(ox + s[i][0] * unit, 20 + s[i][1] * unit);
  }
  ctx.stroke();
}
drawVar("v1", styleize(addSwash(buildTouch("fayaaa", 0.8)), { slant: 0.52, asc: 1.18, desc: 1.08, xs: 0.92 }), 0.8, 2.9);
drawVar("v2", styleize(addSwash(buildTouch("fayaaa", 1.2)), { slant: 0.45, asc: 1.05, desc: 1.0, xs: 0.95 }), 1.0, 2.4);
draw("v3", styleize(buildTouch("fayaaa", 2), { slant: 0.14, asc: 0.82, desc: 0.85 }), 1.6);
draw("v4", buildTouch("fayaaa", 2), 1.6);
</script>
</body>
